# Four engines across both models/all beams: 48 workloads / 192 jobs.
# Public SGLang is the reference; currently equivalent to default.yml.
scenarios: [qwen3_0_6B, qwen3_1_7B]
solutions: [sid_gr_inference, sglang, sglang_beam_search, sglang_beam_search_new]
baseline: sglang
hardware: rtx_pro_6000_blackwell_server
execution:
  gpu: ${BENCHMARK_GPU:-}
  timeout_seconds: 1800
  continue_on_error: true
output_dir: ../../results
