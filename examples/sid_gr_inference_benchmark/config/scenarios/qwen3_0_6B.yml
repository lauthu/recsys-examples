name: qwen3_0_6B
model:
  id: Qwen/Qwen3-0.6B
  # Immutable checkpoint: https://huggingface.co/Qwen/Qwen3-0.6B/tree/c1899de289a04d12100db370d81485cdf75e47ca
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  # QWEN3_0_6B_MODEL optionally selects a local checkpoint directory. Empty means
  # e2e downloads this snapshot; plan/report do not fetch checkpoints. Either way,
  # e2e verifies model files against Hub hashes, so Hub metadata must be reachable.
  # Reports retain checkpoint hashes. Relative paths use the benchmark directory.
  path: ${QWEN3_0_6B_MODEL:-}
  dtype: bfloat16
  quantization: none
  kv_cache_dtype: bfloat16
inputs:
  type: synthetic_tokens
  seed: 42
  context_lengths: [1000, 5000]
  batch_sizes: [1, 2, 4, 8]
generation:
  beam_widths: [64, 128, 256]
  output_tokens: 3
  return_beams: all
  ignore_eos: true
  length_penalty: 0
  score: cumulative_logprob
  constraints: none

# Measurement protocol is part of the scenario, shared by all candidates.
measurement:
  warmup_runs: 5
  repeats: 30
