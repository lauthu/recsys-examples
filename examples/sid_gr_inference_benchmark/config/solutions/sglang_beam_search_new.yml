name: sglang_beam_search_new
adapter: entrypoints.sglang_beam_search_new.adapter
# ${NAME:-default} reads the controller environment; paths are relative to the
# benchmark directory. Prepare this pinned checkout and its matching runtime.
source:
  # SGLANG_BEAM_NEW_SOURCE: checkout override; it must be clean at expected_commit.
  path: ${SGLANG_BEAM_NEW_SOURCE:-../sglang_beam_search_new}
  # https://github.com/cswuyg/sglang/tree/df191d672f1955d273bf56fe21684b60dcf6a891
  expected_commit: df191d672f1955d273bf56fe21684b60dcf6a891
runtime:
  # SGLANG_BEAM_NEW_RUNTIME: local Python subprocess or docker container.
  kind: ${SGLANG_BEAM_NEW_RUNTIME:-local}
  # SGLANG_BEAM_NEW_PYTHON: interpreter in the selected runtime; a local venv is allowed.
  python: ${SGLANG_BEAM_NEW_PYTHON:-python3}
  # SGLANG_BEAM_NEW_IMAGE: Docker-only image override; execution freezes its local ID.
  # Build first with build_recipe and the source checkout at expected_commit.
  image: ${SGLANG_BEAM_NEW_IMAGE:-sid-gr-benchmark:beam-df191d6-cu130}
  build_recipe: entrypoints/sglang_beam_search_new/Dockerfile
engine:
  # Enables SGLang radix caching. Identical warmups/repeats include warm prefix
  # reuse; set false to disable reuse for this candidate.
  prefix_cache: true
  page_size: 1 # Required by the beam-search adapter.
  disable_overlap_schedule: true # Use the non-overlapped scheduler.
  disable_cuda_graph: false # Permit CUDA graph replay for supported shapes.
  # Beam cascade attention requires FlashInfer decode; set cascade false to disable it.
  decode_attention_backend: flashinfer
  enable_beam_cascade_attention: true
  mem_fraction_static: 0.70 # Fraction of GPU memory for weights and KV cache.
  log_level: warning
# No additional backend environment settings are required by this candidate.
# The harness supplies CUDA_VISIBLE_DEVICES and per-run cache directories;
# select the GPU with BENCHMARK_GPU in the run config, not with worker env values.
env: {}
