# Solution: the vedantjh2/sglang fork, native beam_width API; with --catalog it
# decodes through its trie output head. Loaded into bench.config.Solution.

engine: vedantjh2-sglang

source:
  url: https://github.com/vedantjh2/sglang
  commit: "646a7f5ce6f94be84237c50cd41bb2e7beca7788"
  branch: trie-head   # the image tag names it; the branch has moved on since

# Server environment, passed verbatim. Values are strings: quote numbers.
env:
  OMP_NUM_THREADS: "10"
  MKL_NUM_THREADS: "10"
  PYTHONUNBUFFERED: "1"
  # "true" shares the context's attention across beams; decode then runs eagerly.
  SGLANG_BEAM_SHARED_CONTEXT_ATTENTION: "false"

# SGLang ServerArgs, passed verbatim. The runner sets model_path, host, port
# and CUDA graph sizes.
server_settings:
  dtype: bfloat16
  kv_cache_dtype: auto
  tp_size: 1                        # required: phase markers need one process
  skip_tokenizer_init: true         # requests send token IDs
  disable_radix_cache: true         # no prefix reuse between requests
  random_seed: 42
  prefill_attention_backend: flashinfer
  decode_attention_backend: flashinfer
  disable_overlap_schedule: true    # false runs SGLang's overlap scheduler
  page_size: 1                      # required by SGLang beam search
  disable_cuda_graph: false
  cuda_graph_backend_prefill: breakable
  chunked_prefill_size: -1          # one prefill chunk per request
  max_running_requests: 1280        # >= concurrency x (beam_width + 1)
  mem_fraction_static: 0.7
  skip_server_warmup: true          # the client sends its own warmups
  log_level: warning

# Catalog token layout, used with --catalog: the token at depth d lies in
# [token_start + d * codebook_size, token_start + (d + 1) * codebook_size).
trie_config:
  token_start: 1000
  codebook_size: 1000
