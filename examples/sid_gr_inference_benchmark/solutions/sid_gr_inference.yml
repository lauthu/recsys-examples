name: sid_gr_inference
adapter: entrypoints.sid_gr_inference.adapter
source:
  path: ${SID_GR_SOURCE:-../sid-gr-inference}
runtime:
  kind: ${SID_GR_RUNTIME:-local}
  python: ${SID_GR_PYTHON:-python3}
  image: ${SID_GR_IMAGE:-}
  mounts: ["${GR_DECODE_ATTEN_ROOT:-}"]
engine: {}
env:
  GR_DECODE_ATTEN_ROOT: ${GR_DECODE_ATTEN_ROOT:-}
  GR_INFERENCE_FUSED_BEAM_LOGSUMEXP: ${GR_INFERENCE_FUSED_BEAM_LOGSUMEXP:-0}
